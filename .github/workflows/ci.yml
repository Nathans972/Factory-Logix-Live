name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Engine tests
        run: pnpm --filter @fld/engine test
      - name: Other unit tests
        run: pnpm --filter @fld/api --filter @fld/collector --filter @fld/web test
      - name: Build web (mock)
        run: pnpm build:web:mock
