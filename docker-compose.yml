# FactoryLogix Live Dashboard — on-premises deployment (spec 13.3)
# Services: db (PostgreSQL 16 + TimescaleDB), collector, api, web (nginx: static frontend + reverse proxy).
# Single published port: ${WEB_PORT:-8080}. Everything else stays on the internal network.

services:
  db:
    # Pinned to an exact TimescaleDB release. To move to a newer one, follow
    # docs/OPERATIONS.md → Upgrades → "The database image".
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fld}
      POSTGRES_USER: ${POSTGRES_USER:-fld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - fld-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fld} -d ${POSTGRES_DB:-fld}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fld]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      # The database login goes in as parts, not as one postgres:// URL: the api builds the URL
      # itself and percent-encodes the user and password, so a / ? # or @ in the password
      # (openssl rand -base64, a password manager) cannot break it.
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fld}
      POSTGRES_USER: ${POSTGRES_USER:-fld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-America/New_York}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MIGRATIONS_DIR: /app/db/migrations
      # An https:// FactoryLogix whose certificate is self-signed or from the plant's own CA: that CA's
      # certificate goes in certs/ and FACTORYLOGIX_CA_CERT in .env names it (docs/INSTALL.md, section 10).
      # Empty without it, and Node trusts only its built-in public CAs.
      NODE_EXTRA_CA_CERTS: ${FACTORYLOGIX_CA_CERT:+/app/certs/}${FACTORYLOGIX_CA_CERT:-}
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [fld]

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # As parts, not as a URL, for the same reason as the api.
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fld}
      POSTGRES_USER: ${POSTGRES_USER:-fld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-America/New_York}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The same CA as the api: the api tests the connection, the collector polls.
      NODE_EXTRA_CA_CERTS: ${FACTORYLOGIX_CA_CERT:+/app/certs/}${FACTORYLOGIX_CA_CERT:-}
    volumes:
      - ./certs:/app/certs:ro
    networks: [fld]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [fld]

volumes:
  fld-db-data:

networks:
  fld:
