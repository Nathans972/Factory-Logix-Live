# FactoryLogix Live Dashboard — on-premises deployment (spec 13.3)
# Services: db (PostgreSQL 16 + TimescaleDB), collector, api, web (nginx: static frontend + reverse proxy).
# Single published port: ${WEB_PORT:-8080}. Everything else stays on the internal network.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fld}
      POSTGRES_USER: ${POSTGRES_USER:-fld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - fld-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fld} -d ${POSTGRES_DB:-fld}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fld]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-fld}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fld}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-America/New_York}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATIONS_DIR: /app/db/migrations
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [fld]

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fld}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fld}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-America/New_York}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [fld]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [fld]

volumes:
  fld-db-data:

networks:
  fld:
